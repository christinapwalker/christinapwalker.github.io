name: automatically update CV PDF from Overleaf

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PDF from Overleaf
        run: |
          curl -L "https://www.overleaf.com/download/project/69dce6e263afa3c28a92731d/build/latest/output/output.pdf" \
            -o cv/cv.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cv/cv.pdf
          git diff --staged --quiet || git commit -m "Update CV PDF"
          git push

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
