name: automatically update CV PDF from Overleaf

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PDF from Overleaf
        run: |
          curl -L "https://www.overleaf.com/download/project/69dce6e263afa3c28a92731d/build/latest/output/output.pdf" \
            -o cv/cv.pdf

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cv/cv.pdf
          git diff --staged --quiet || git commit -m "Update CV PDF"
          git push
